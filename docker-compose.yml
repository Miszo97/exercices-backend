version: "3.9"

services:
  db:
    image: postgres:18-alpine
    env_file:
      - compose.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - compose.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
       - .:/app

volumes:
  pgdata:
