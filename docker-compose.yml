services:
  db:
    image: postgres:18-alpine
    env_file:
      - compose.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/miszo97/exercices-backend:latest
    build: .
    env_file:
      - compose.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
       - .:/app

volumes:
  pgdata:
